name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install uv==0.11.17
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra eval --extra security
      - run: uv run ruff check src tests scripts deployment
      - run: uv run python -m compileall -q src tests scripts deployment
      - run: uv run python -m pytest -q
      - run: uv run python scripts/run_evaluation.py
      - run: uv run python -m pip_audit --local --progress-spinner off

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        name: Build application image
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ontheline:test
      - uses: docker/build-push-action@v7
        name: Build AgentCore image
        with:
          context: .
          file: Dockerfile.agentcore
          platforms: linux/arm64
          load: true
          tags: ontheline-agentcore:test
